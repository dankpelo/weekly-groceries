<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="img/icon-logo.svg" type="image/x-icon">
</head>

<body>
    <img src="img/logo.svg" alt="logo" >

    
    <main>
        <a href="#"><- Voltar</a>
        <h2>Compras da semana</h2>
        <form>
            <input type="text" name="add-item" id="add-item" placeholder="Adicione um novo item">
            <button>Adicionar item</button>
        </form>
        <div id="items">

            <div class="item-row">
                <label for="item1" class="item-name">
                    <input type="checkbox" id="item1" class="checkbox-input" >Pão de forma
                </label>
                <img src="img/icon-delete.svg" alt="delete-icon" class="delete-icon">
            </div>
        
            <div class="item-row">
                <label for="item2" class="item-name">
                    <input type="checkbox" id="item2" class="checkbox-input" >Café preto
                </label>
                <img src="img/icon-delete.svg" alt="delete-icon" class="delete-icon">
            </div>

            <div class="item-row">
                <label for="item3" class="item-name">
                    <input type="checkbox" id="item3" class="checkbox-input" >Suco de laranja
                </label>
                <img src="img/icon-delete.svg" alt="delete-icon" class="delete-icon">
            </div>

            <div class="item-row">
                <label for="item4" class="item-name">
                    <input type="checkbox" id="item4" class="checkbox-input" >Bolacha
                </label>
                <img src="img/icon-delete.svg" alt="delete-icon" class="delete-icon">
            </div>

        </div>

        <div role="alert" class="alert-box">
            <div class="alert-content">
                <img src="img/warning-circle-filled.svg" alt="warning-circle">
                <span>O item foi removido da lista</span>
            </div>
            <img src="img/delete-small.svg" alt="delete-icon" id="alert-x">
        </div>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
